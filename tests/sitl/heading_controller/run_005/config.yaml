test_type: heading_controller
recording:
  topics:
  - /arva_test_protocol/event
  - /arva_master/mode_state
  - /pieps/measurement
  - /fmu/out/vehicle_local_position
  - /fmu/out/vehicle_attitude
  - /fluxline_controller/cmd_vel
artifacts:
  parameter_files:
  - px4_roscon_25/arva_master/cfg/fluxline_follow.yaml
  - px4_roscon_25/arva_master/cfg/mode_executor.yaml
metadata_defaults:
  coordinate_convention: PX4 local NED (x North, y East, z Down)
  flight_condition: operator-stabilized hover with zero commanded linear velocity
test:
  heading_offsets_deg: []
  repetitions_per_offset: 1
  commanded_linear_velocity_mps: 0.0
  timeout_s: 180
  convergence_threshold_deg: 5.0
analysis:
  kind: heading_controller
  settling_band_deg: 5.0
  steady_state_window_s: 5.0
  segments: []
  use_active_mode_interval: true
