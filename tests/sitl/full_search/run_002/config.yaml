test_type: full_search
recording:
  topics:
  - /arva_test_protocol/event
  - /arva_master/mode_state
  - /parameter_events
  - /pieps/measurement
  - /fmu/in/trajectory_setpoint
  - /fmu/out/vehicle_local_position
  - /fmu/out/vehicle_attitude
  - /terrain_controller/cmd_vel
  - /fluxline_controller/cmd_vel
  - /finesearch_controller/cmd_vel
  - /finesearch_controller/completed
  - /finesearch_controller/estimated_position
  - /finesearch_controller/state
artifacts:
  parameter_files:
  - px4_roscon_25/arva_master/cfg/fine_search.yaml
  - px4_roscon_25/arva_master/cfg/fluxline_follow.yaml
  - px4_roscon_25/arva_master/cfg/mode_executor.yaml
  - px4_roscon_25/arva_master/cfg/terrain_follow.yaml
  - px4_roscon_25/arva_master/cfg/waypoint_follow.yaml
  - px4_roscon_25/arva_sim/cfg/arva_sim.yaml
metadata_defaults:
  coordinate_convention: PX4 local NED (x North, y East, z Down)
  receiver_reference: ARVA receiver antenna phase center
  environment: sitl
test:
  search_polygon_ned_m: []
  planned_coverage_waypoints_ned_m:
  - - 0.0
    - 0.0
  - - 0.0
    - 50.0
  - - 15.0
    - 50.0
  - - 15.0
    - 0.0
  - - 30.0
    - 0.0
  - - 30.0
    - 50.0
  - - 45.0
    - 50.0
  - - 45.0
    - 0.0
  - - 60.0
    - 0.0
  - - 60.0
    - 50.0
  - - 75.0
    - 50.0
  - - 75.0
    - 0.0
  - - 90.0
    - 0.0
  - - 90.0
    - 50.0
  waypoint_parameter: waypoints_ned
  transmitter_position_ned_m:
  - 50.0
  - 15.0
  - 0.0
  transmitter_heading_rad: 0.0
  reset_fine_search_before_run: true
  auto_complete_on_fine_search: false
  repetitions: 3
  timeout_s: 900
analysis:
  kind: full_search
  require_land_transition: true
